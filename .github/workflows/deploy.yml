name: Deploy Built Stage

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write
  issues: read

concurrency:
  group: deploy-stage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '21.7.1'

      - name: Confirm CHUB_AUTH_TOKEN is set
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
        run: |
          if [ -z "$CHUB_AUTH_TOKEN" ]; then
            echo "CHUB_AUTH_TOKEN is not set for this repository."
            exit 1
          fi

      - name: Get or Make Stage ID
        if: ${{ !contains(github.repository, 'template') }}
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
          STAGE_ID_SECRET: ${{ secrets.STAGE_ID }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p public
          touch public/chub_meta.yaml

          if ! grep -q '^github_path:' public/chub_meta.yaml; then
            echo "github_path: 'https://github.com/${REPOSITORY}'" >> public/chub_meta.yaml
          fi

          STAGE_ID="${STAGE_ID_SECRET:-}"
          if [ -z "$STAGE_ID" ]; then
            STAGE_ID="$(sed -n "s/^extension_id:[[:space:]]*['\"]\{0,1\}\([^'\"]*\)['\"]\{0,1\}[[:space:]]*$/\1/p" public/chub_meta.yaml | head -n 1)"
          fi

          if [ -z "$STAGE_ID" ]; then
            echo "No stage ID found; requesting one from Chub."
            HTTP_STATUS="$(curl --silent --show-error \
              --output creation.json \
              --write-out '%{http_code}' \
              -H "CH-API-KEY: ${CHUB_AUTH_TOKEN}" \
              -H "Content-Type: application/json" \
              --request POST \
              --data "{\"name\":\"${REPOSITORY_NAME}\"}" \
              https://api.chub.ai/extensions)"

            echo "Chub HTTP status: ${HTTP_STATUS}"
            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
              echo "Chub stage creation request failed. Response body:"
              cat creation.json
              exit 1
            fi

            STAGE_ID="$(jq -r '.id_v2 // empty' creation.json)"
            if [ -z "$STAGE_ID" ]; then
              echo "Chub response did not contain id_v2. Response body:"
              cat creation.json
              exit 1
            fi

            echo "extension_id: '${STAGE_ID}'" >> public/chub_meta.yaml
          fi

          if ! grep -q '^github_path:' public/chub_meta.yaml || ! grep -q '^extension_id:' public/chub_meta.yaml; then
            echo "Required stage metadata is missing."
            exit 1
          fi

          echo "STAGE_ID=${STAGE_ID}" >> "$GITHUB_ENV"

          if ! git diff --quiet -- public/chub_meta.yaml; then
            git config user.email "action@github.com"
            git config user.name "GitHub Action"
            git add public/chub_meta.yaml
            git commit -m "Update Chub stage metadata"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Char UUIDGen
        if: ${{ !contains(github.repository, 'template') }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y uuid-runtime

          shopt -s nullglob
          for file in public/characters/*.yaml; do
            if ! grep -q 'project_uuid:' "$file"; then
              uuid="$(uuidgen)"
              printf '\nproject_uuid: %s\n' "$uuid" >> "$file"
              git add "$file"
            fi
          done

          if ! git diff --cached --quiet; then
            git config user.email "action@github.com"
            git config user.name "GitHub Action"
            git commit -m "Add project UUIDs"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Zip the build folder
        run: |
          cd dist
          zip -r ../build.zip .
          cd ..

      - name: Upload the build
        if: ${{ !contains(github.repository, 'template') }}
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          HTTP_STATUS="$(curl --silent --show-error \
            --output upload-response.txt \
            --write-out '%{http_code}' \
            -H "CH-API-KEY: ${CHUB_AUTH_TOKEN}" \
            -F "file=@build.zip" \
            "https://api.chub.ai/extension/${STAGE_ID}/upload")"

          echo "Chub upload HTTP status: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Chub upload failed. Response body:"
            cat upload-response.txt
            exit 1
          fi

      - name: Setup .npmrc
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config --global user.email "bot@chub.ai"
          git config --global user.name "Chub Bot"
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc

      - name: Extract version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Update package.json version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          yarn build --mode lib
          yarn version --new-version "$VERSION" --no-git-tag-version
          yarn publish --access public
