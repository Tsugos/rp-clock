project_name: "RP Clock — Personal"
tagline: "Branch-safe roleplay date and time"
visibility: 'PRIVATE'
position: 'NONE'
tags:
  - 'Roleplay'
  - 'Time'
config_schema:
  type: object
  properties:
    initial_date:
      type: string
      default: '2026-02-02'
      description: 'Starting RP date, YYYY-MM-DD; e.g. 2026-02-02'
    initial_time:
      type: string
      default: '18:46'
      description: 'Starting RP time, HH:MM (24-hour clock)'
    show_timestamp:
      type: boolean
      default: true
github_path: 'https://github.com/Tsugos/rp-clock'
